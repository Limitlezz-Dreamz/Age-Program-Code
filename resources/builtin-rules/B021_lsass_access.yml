title: LSASS process access
id: B021
status: stable
level: high
author: Logwarden built-in
tags:
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    Channel: Microsoft-Windows-Sysmon/Operational
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1038'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_auth:
    SourceUser|contains:
      - AUTHORI
      - AUTORI
  filter_src:
    SourceImage|endswith:
      - '\Sysmon64.exe'
      - '\Sysmon.exe'
      - '\MsMpEng.exe'
  condition: selection and not 1 of filter_*
