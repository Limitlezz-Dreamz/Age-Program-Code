title: Member added to privileged group
id: B007
status: stable
level: high
author: Logwarden built-in
tags:
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    Channel: Security
    EventID:
      - 4728
      - 4732
      - 4756
  privileged:
    TargetSid|endswith:
      - '-512'
      - '-519'
      - 'S-1-5-32-544'
      - 'S-1-5-32-555'
      - 'S-1-5-32-551'
  privileged_name:
    TargetUserName|contains:
      - Administrators
      - Domain Admins
      - Enterprise Admins
      - Remote Desktop Users
      - Backup Operators
  condition: selection and (privileged or privileged_name)
