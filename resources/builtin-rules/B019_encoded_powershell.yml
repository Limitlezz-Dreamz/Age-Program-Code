title: Encoded PowerShell command
id: B019
status: stable
level: high
author: Logwarden built-in
tags:
  - attack.t1059.001
  - attack.t1027
logsource:
  product: windows
detection:
  selection_proc:
    EventID:
      - 1
      - 4688
    Channel:
      - Microsoft-Windows-Sysmon/Operational
      - Security
    CommandLine|re: '(?i)\s-(e|en|enc|enco|encod|encode|encoded|encodedc|encodedcommand)\s+[A-Za-z0-9+/=]{20,}'
  image_ps:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  image_ps_new:
    NewProcessName|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_classic:
    Channel: Windows PowerShell
    EventID: 400
    HostApplication|re: '(?i)-(e|en|enc|encodedcommand)\s+[A-Za-z0-9+/=]{20,}'
  condition: (selection_proc and (image_ps or image_ps_new)) or selection_classic
