title: Suspicious service installed
id: B004-suspicious
status: stable
level: high
author: Logwarden built-in
tags:
  - attack.t1543.003
  - attack.t1569.002
logsource:
  product: windows
detection:
  selection:
    Channel: System
    EventID: 7045
  suspicious_path:
    ImagePath|contains:
      - cmd
      - powershell
      - '%COMSPEC%'
      - '\Temp\'
      - '\Users\'
      - '\ProgramData\'
      - ADMIN$
  suspicious_name:
    ServiceName: PSEXESVC
  condition: selection and (suspicious_path or suspicious_name)
