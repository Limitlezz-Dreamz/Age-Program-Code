[package]
name = "logwarden"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logwarden desktop app (Tauri shell)"
authors = ["Logwarden contributors"]
publish = false

[lib]
name = "logwarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
ts-rs = ["dep:ts-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lw-core = { workspace = true }
lw-ingest = { workspace = true }
lw-normalize = { workspace = true }
lw-store = { workspace = true }
lw-rules = { workspace = true }
lw-detect = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
num_cpus = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }
