name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Builds native installers via tauri-apps/tauri-action and attaches them to a
# GitHub Release. Optional secrets (see docs/packaging.md):
#   Updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   Apple:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
jobs:
  publish-tauri:
    name: bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install npm deps
        run: npm ci

      # Secret comparisons in `if:` / `with:` break workflow validation — gate in bash instead.
      - name: Enable updater artifacts when signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("src-tauri/tauri.conf.json")
          conf = json.loads(p.read_text())
          conf.setdefault("bundle", {})["createUpdaterArtifacts"] = True
          p.write_text(json.dumps(conf, indent=2) + "\n")
          print("createUpdaterArtifacts=true")
          PY
            echo "UPLOAD_UPDATER_JSON=true" >> "$GITHUB_ENV"
          else
            echo "UPLOAD_UPDATER_JSON=false" >> "$GITHUB_ENV"
            echo "No TAURI_SIGNING_PRIVATE_KEY — skipping updater artifacts"
          fi

      - name: Configure Apple signing (optional)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE — ad-hoc signing (signingIdentity: -)"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF"
            echo "$APPLE_CERTIFICATE"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Apple signing secrets exported"

      - name: Configure Windows Authenticode (optional)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "No WINDOWS_CERTIFICATE — unsigned Windows build"
            exit 0
          fi
          {
            echo "WINDOWS_CERTIFICATE<<EOF"
            echo "$WINDOWS_CERTIFICATE"
            echo "EOF"
            echo "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Windows signing secrets exported"

      - name: Build and upload Logwarden
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Logwarden v__VERSION__
          releaseBody: |
            Offline EVTX threat hunting desktop build.

            Installers for macOS (Apple Silicon + Intel), Linux (deb/AppImage), and Windows (NSIS/MSI).
            See `docs/packaging.md` for signing and verification notes.
          releaseDraft: true
          prerelease: false
          # Always upload updater JSON when present; without a signing key, no .sig artifacts are produced.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
