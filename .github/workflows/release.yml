name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Builds native installers via tauri-apps/tauri-action and attaches them to a
# GitHub Release. Signing secrets (optional — see docs/packaging.md):
#   Updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   Apple:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD (Authenticode)
jobs:
  publish-tauri:
    name: bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install npm deps
        run: npm ci

      # Signed updater artifacts require TAURI_SIGNING_PRIVATE_KEY (repo secret).
      - name: Enable updater artifacts when signing key is configured
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("src-tauri/tauri.conf.json")
          conf = json.loads(p.read_text())
          conf.setdefault("bundle", {})["createUpdaterArtifacts"] = True
          p.write_text(json.dumps(conf, indent=2) + "\n")
          print("createUpdaterArtifacts=true")
          PY

      # Only inject Apple/Windows cert env when secrets are non-empty.
      # Empty APPLE_CERTIFICATE breaks ad-hoc macOS signing.
      - name: Configure Apple signing (optional)
        if: startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE != ''
        run: |
          {
            echo "APPLE_CERTIFICATE<<EOF"
            echo "${{ secrets.APPLE_CERTIFICATE }}"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Configure Windows Authenticode (optional)
        if: matrix.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE != ''
        shell: bash
        run: |
          {
            echo "WINDOWS_CERTIFICATE<<EOF"
            echo "${{ secrets.WINDOWS_CERTIFICATE }}"
            echo "EOF"
            echo "WINDOWS_CERTIFICATE_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build and upload Logwarden
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Logwarden v__VERSION__
          releaseBody: |
            Offline EVTX threat hunting desktop build.

            Installers for macOS (Apple Silicon + Intel), Linux (deb/AppImage), and Windows (NSIS/MSI).
            See `docs/packaging.md` for signing and verification notes.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: ${{ matrix.args }}
