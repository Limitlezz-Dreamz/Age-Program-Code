name: AuthTriage

on:
  push:
    paths:
      - "authtriage/**"
      - ".github/workflows/authtriage.yml"
  pull_request:
    paths:
      - "authtriage/**"
      - ".github/workflows/authtriage.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: authtriage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Test
        run: python -m pytest -q
